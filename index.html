<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você 🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0520 0%, #1a0530 50%, #0d0220 100%);
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 🌿 Caule Principal */
        .stem-main {
            position: absolute;
            bottom: 60px;
            width: 8px;
            background: linear-gradient(to right, #2ec770, #4ade80);
            border-radius: 4px;
            height: 0;
            transform-origin: bottom center;
            animation: growStem 3s ease-out forwards;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        @keyframes growStem {
            0% { height: 0; }
            100% { height: 180px; }
        }

        /* 🍃 Folhas */
        .leaf {
            position: absolute;
            width: 0;
            height: 0;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-radius: 50% 0 50% 0;
            opacity: 0;
            transform-origin: left center;
        }

        .leaf-1 {
            bottom: 140px; left: -8px; transform: rotate(-30deg);
            animation: showLeaf 1.5s ease-out 2.2s forwards;
        }
        .leaf-2 {
            bottom: 100px; right: -8px; transform: rotate(30deg); border-radius: 0 50% 0 50%;
            animation: showLeaf 1.5s ease-out 2.5s forwards;
        }
        .leaf-3 {
            bottom: 60px; left: -6px; transform: rotate(-20deg);
            animation: showLeaf 1.5s ease-out 2.8s forwards;
        }

        @keyframes showLeaf {
            0% { width: 0; height: 0; opacity: 0; }
            100% { width: 45px; height: 25px; opacity: 1; }
        }

        /* 🌱 Caule das Flores Secundárias */
        .stem-side {
            position: absolute;
            bottom: 180px;
            width: 4px;
            background: linear-gradient(to bottom, #4ade80, #2ec770);
            border-radius: 2px;
            height: 0;
            transform-origin: bottom center;
            opacity: 0.8;
        }

        .stem-s1 { transform: rotate(-35deg); bottom: 160px; animation: growSide 2s ease-out 3s forwards; }
        .stem-s2 { transform: rotate(30deg); bottom: 150px; animation: growSide 2s ease-out 3.3s forwards; }

        @keyframes growSide {
            0% { height: 0; }
            100% { height: 100px; }
        }

        /* 💜 Flores */
        .flower {
            position: absolute;
            opacity: 0;
            transform-origin: bottom center;
            transform: scale(0) rotate(0deg);
        }

        .flower-center {
            position: relative;
            top: -10px;
        }

        /* Pétalas */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffffff 0%, #e2d5ff 40%, #a855f7 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: center bottom;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4), inset 0 -5px 10px rgba(139, 69, 213, 0.2);
        }

        .flower-main .petal:nth-child(1) { transform: rotate(0deg) translateY(-18px); }
        .flower-main .petal:nth-child(2) { transform: rotate(72deg) translateY(-18px); }
        .flower-main .petal:nth-child(3) { transform: rotate(144deg) translateY(-18px); }
        .flower-main .petal:nth-child(4) { transform: rotate(216deg) translateY(-18px); }
        .flower-main .petal:nth-child(5) { transform: rotate(288deg) translateY(-18px); }

        .flower-side .petal:nth-child(1) { transform: rotate(0deg) translateY(-14px); }
        .flower-side .petal:nth-child(2) { transform: rotate(72deg) translateY(-14px); }
        .flower-side .petal:nth-child(3) { transform: rotate(144deg) translateY(-14px); }
        .flower-side .petal:nth-child(4) { transform: rotate(216deg) translateY(-14px); }
        .flower-side .petal:nth-child(5) { transform: rotate(288deg) translateY(-14px); }

        .pistil {
            position: absolute;
            width: 10px; height: 10px;
            background: radial-gradient(circle, #fef08a, #facc15);
            border-radius: 50%;
            top: -8px; left: 50%;
            margin-left: -5px;
            box-shadow: 0 0 12px #facc15, 0 0 20px rgba(250, 204, 21, 0.5);
            z-index: 10;
        }

        /* Animação Flores */
        .flower-1 { top: -180px; left: 50%; margin-left: -30px; animation: bloom 1.8s ease-out 4s forwards; }
        .flower-2 { top: -110px; left: 18%; animation: bloom 1.8s ease-out 4.8s forwards; }
        .flower-3 { top: -100px; right: 15%; animation: bloom 1.8s ease-out 5.2s forwards; }

        @keyframes bloom {
            0% { opacity: 0; transform: scale(0) rotate(-10deg); }
            60% { opacity: 1; transform: scale(1.15) rotate(3deg); }
            80% { transform: scale(0.95) rotate(-1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Brilhos e Partículas */
        .sparkle {
            position: absolute;
            width: 6px; height: 6px;
            background: radial-gradient(circle, #fff, #d8b4fe);
            border-radius: 50%;
            opacity: 0;
            filter: blur(1px);
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .glow {
            position: absolute;
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 70%);
            border-radius: 50%;
            top: -150px; left: 50%; margin-left: -40px;
            opacity: 0;
            animation: glowPulse 3s ease-out 5s forwards;
        }

        @keyframes glowPulse {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.2); }
            100% { opacity: 0.35; transform: scale(1); }
        }

        /* Texto */
        .text-box {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(25px);
            animation: showText 2s ease-out 7s forwards;
            text-align: center;
            padding: 0 20px;
        }

        .message {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            color: #e9d5ff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6), 0 0 20px rgba(124, 58, 237, 0.3);
            letter-spacing: 1px;
            font-style: italic;
        }

        /* Brisa suave */
        .all-flowers {
            animation: breeze 5s ease-in-out 6s infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes breeze {
            0% { transform: rotate(-1.5deg); }
            100% { transform: rotate(1.5deg); }
        }

        /* Responsividade das pétalas */
        .flower-main .petal { width: 28px; height: 38px; }
        .flower-side .petal { width: 22px; height: 30px; }

        @media (max-width: 360px) {
            .flower-main .petal { width: 24px; height: 32px; }
            .flower-side .petal { width: 19px; height: 26px; }
            @keyframes growStem { 0%{height:0} 100%{height:150px} }
            .flower-1 { top: -150px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="all-flowers">
            <div class="glow"></div>

            <!-- Caule Principal -->
            <div class="stem-main">
                <div class="leaf leaf-1"></div>
                <div class="leaf leaf-2"></div>
                <div class="leaf leaf-3"></div>
            </div>

            <!-- Caules Secundários -->
            <div class="stem-side stem-s1"></div>
            <div class="stem-side stem-s2"></div>

            <!-- Flor Principal (maior) -->
            <div class="flower flower-main flower-1">
                <div class="flower-center">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="pistil"></div>
                </div>
            </div>

            <!-- Flor Esquerda -->
            <div class="flower flower-side flower-2">
                <div class="flower-center">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="pistil"></div>
                </div>
            </div>

            <!-- Flor Direita -->
            <div class="flower flower-side flower-3">
                <div class="flower-center">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="pistil"></div>
                </div>
            </div>

            <!-- Brilhos flutuantes -->
            <div class="sparkle" style="top: -210px; left: 42%; animation-delay: 4.5s;"></div>
            <div class="sparkle" style="top: -230px; left: 55%; animation-delay: 5s;"></div>
            <div class="sparkle" style="top: -160px; left: 25%; animation-delay: 5.5s;"></div>
            <div class="sparkle" style="top: -185px; right: 20%; animation-delay: 6s;"></div>
            <div class="sparkle" style="top: -200px; right: 40%; animation-delay: 6.5s;"></div>
        </div>
    </div>

    <!-- Mensagem Final -->
    <div class="text-box">
        <p class="message">💜 Você é muito especial 💜</p>
    </div>

</body>
</html>
