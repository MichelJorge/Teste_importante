<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Mágicas Neon</title>

<link href="https://apis.com/css2?family=Alegreya:wght@400;700&display=swap

<style>

:root{
  --bg:#090015;
  --purple:#a855f7;
  --purple2:#c084fc;
  --pink:#ffb7ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:radial-gradient(circle at center,#120029,#05000d);
  font-family:Alegreya,serif;
}

canvas{
  position:absolute;
  inset:0;
}

.container{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.magic-garden{
  position:relative;
  width:450px;
  height:600px;
}

/* FLORES */

.flower{
  position:absolute;
  bottom:80px;
}

.stem{
  width:4px;
  height:0;
  border-radius:20px;
  background:linear-gradient(
    to top,
    #512bff,
    #8d5eff,
    #c084fc
  );

  box-shadow:
  0 0 8px #8d5eff,
  0 0 20px #8d5eff;

  animation:growStem 3s ease forwards;
}

.head{
  position:absolute;
  width:74px;
  height:74px;
  left:-35px;
  top:-38px;
  transform:scale(0);
  opacity:0;
  animation:bloom 2s ease forwards;
}

.head::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  radial-gradient(circle at 50% 40%, #ffd2ff 0 8px, transparent 10px),

  radial-gradient(circle at 50% 0%, #ca8fff 0 17px, transparent 18px),

  radial-gradient(circle at 15% 35%, #ca8fff 0 17px, transparent 18px),

  radial-gradient(circle at 85% 35%, #ca8fff 0 17px, transparent 18px),

  radial-gradient(circle at 30% 85%, #ca8fff 0 17px, transparent 18px),

  radial-gradient(circle at 70% 85%, #ca8fff 0 17px, transparent 18px);

  filter:
  drop-shadow(0 0 10px #d8b4fe)
  drop-shadow(0 0 25px #9333ea)
  drop-shadow(0 0 40px #9333ea);
}

/* POSIÇÕES */

.f1{left:220px;}
.f2{left:150px;}
.f3{left:290px;}
.f4{left:100px;}
.f5{left:340px;}
.f6{left:180px;}
.f7{left:250px;}
.f8{left:310px;}

.f1 .stem{height:300px;}
.f2 .stem{height:250px;}
.f3 .stem{height:240px;}
.f4 .stem{height:210px;}
.f5 .stem{height:220px;}
.f6 .stem{height:180px;}
.f7 .stem{height:170px;}
.f8 .stem{height:180px;}

.f1 .head{animation-delay:2.8s;}
.f2 .head{animation-delay:3.2s;}
.f3 .head{animation-delay:3.6s;}
.f4 .head{animation-delay:4s;}
.f5 .head{animation-delay:4.4s;}
.f6 .head{animation-delay:4.8s;}
.f7 .head{animation-delay:5.2s;}
.f8 .head{animation-delay:5.6s;}

/* BOTÕES */

.bud{
  position:absolute;
  width:28px;
  height:42px;
  border-radius:50%;

  background:
  radial-gradient(circle at 50% 30%,
  #ffd5ff,
  #cf91ff,
  #6d28d9);

  box-shadow:
  0 0 15px #c084fc,
  0 0 40px #9333ea;

  transform:scale(0);
  opacity:0;

  animation:bloom 2s ease forwards;
}

.b1{
  left:195px;
  bottom:220px;
  animation-delay:4s;
}

.b2{
  left:160px;
  bottom:180px;
  animation-delay:4.5s;
}

.b3{
  left:240px;
  bottom:180px;
  animation-delay:5s;
}

/* FOLHAS */

.base{
  position:absolute;
  width:220px;
  height:120px;
  left:50%;
  bottom:50px;
  transform:translateX(-50%);
}

.leaf{
  position:absolute;
  border-radius:50%;
  background:#2e1346;
  box-shadow:0 0 20px rgba(140,80,255,.4);
}

.leaf:nth-child(1){
  width:55px;
  height:55px;
  left:0;
  top:40px;
}

.leaf:nth-child(2){
  width:65px;
  height:65px;
  left:35px;
  top:25px;
}

.leaf:nth-child(3){
  width:75px;
  height:75px;
  left:75px;
  top:15px;
}

.leaf:nth-child(4){
  width:65px;
  height:65px;
  left:130px;
  top:25px;
}

.leaf:nth-child(5){
  width:55px;
  height:55px;
  left:170px;
  top:40px;
}

/* GRAMA */

.grass{
  position:absolute;
  bottom:30px;
  width:3px;
  background:#7028ff;
  border-radius:30px;
  box-shadow:0 0 15px #9333ea;
}

.g1{
  left:20px;
  height:150px;
  transform:rotate(-15deg);
}

.g2{
  left:50px;
  height:120px;
  transform:rotate(15deg);
}

.g3{
  left:80px;
  height:90px;
  transform:rotate(-20deg);
}

.g4{
  right:80px;
  height:90px;
  transform:rotate(20deg);
}

.g5{
  right:50px;
  height:120px;
  transform:rotate(-15deg);
}

.g6{
  right:20px;
  height:150px;
  transform:rotate(15deg);
}

.spark{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  animation:twinkle 3s infinite;
}

/* TEXTO */

.message{
  position:absolute;
  bottom:-10px;
  width:100%;
  text-align:center;
  color:white;
  opacity:0;
  animation:showText 2s ease 6s forwards;
}

.message h1{
  font-size:2rem;
}

.message p{
  color:#c084fc;
}

/* ANIMAÇÕES */

@keyframes growStem{
  from{
    height:0;
  }
}

@keyframes bloom{

  0%{
    opacity:0;
    transform:scale(0);
  }

  70%{
    opacity:1;
    transform:scale(1.2);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes twinkle{

  0%,100%{
    opacity:.2;
  }

  50%{
    opacity:1;
    box-shadow:0 0 10px white;
  }
}

@keyframes showText{
  to{
    opacity:1;
  }
}

</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="container">

  <div class="magic-garden">

    <div class="grass g1"></div>
    <div class="grass g2"></div>
    <div class="grass g3"></div>
    <div class="grass g4"></div>
    <div class="grass g5"></div>
    <div class="grass g6"></div>

    <div class="flower f1"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f2"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f3"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f4"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f5"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f6"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f7"><div class="stem"></div><div class="head"></div></div>
    <div class="flower f8"><div class="stem"></div><div class="head"></div></div>

    <div class="bud b1"></div>
    <div class="bud b2"></div>
    <div class="bud b3"></div>

    <div class="base">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
    </div>

    <div class="message">
      <h1>Você é muito especial 💜</h1>
      <p>E essas flores são para você ✨</p>
    </div>

  </div>

</div>

<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}

resize();
addEventListener("resize",resize);

const stars=[];

for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*2,
    a:Math.random()
  });
}

function animate(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  stars.forEach(s=>{

    s.a+=((Math.random()-0.5)*0.02);

    if(s.a>1)s.a=1;
    if(s.a<0.1)s.a=0.1;

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.fill();

  });

  requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
