  <style>
    :root {
      --ink: #100616;
      --violet: #a855f7;
      --pink: #f472b6;
      --lavender: #e9d5ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "Alegreya", serif;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    .ambient {
      position: absolute;
      border-radius: 999px;
      filter: blur(35px);
      opacity: .6;
      pointer-events: none;
      animation: breathe 6s ease-in-out infinite alternate;
    }

    .ambient-one {
      width: 14rem;
      height: 14rem;
      top: -5rem;
      left: -6rem;
      background: #7e22ce;
    }

    .ambient-two {
      width: 17rem;
      height: 17rem;
      bottom: 0;
      right: -8rem;
      background: #be185d;
      animation-delay: -3s;
    }

    .star-field {
      position: absolute;
      inset: 0;
      opacity: .65;
      background-image: radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1.4px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
      pointer-events: none;
    }

    .reveal-stage {
      position: relative;
      width: min(88vw, 400px);
      aspect-ratio: 4 / 5;
      border-radius: 2.35rem;
      overflow: hidden;
      box-shadow: 0 22px 65px rgba(0, 0, 0, .62), 0 0 0 1px rgba(233, 213, 255, .34), 0 0 40px rgba(192, 132, 252, .24);
      transform: translateY(10px);
      animation: settle .9s ease-out both;
    }

    .reveal-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: inherit;
    }

    .reveal-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(to top, rgba(11, 3, 16, .88) 0%, rgba(11, 3, 16, .14) 46%, rgba(255,255,255,.05) 100%);
    }

    .photo-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #1a0925;
      clip-path: circle(0% at 50% 56%);
      animation: bloom 5.8s cubic-bezier(.16,.85,.25,1) .3s forwards;
    }

    .photo-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.25);
      filter: saturate(.8) blur(9px) brightness(.6);
      animation: focus 5.8s cubic-bezier(.16,.85,.25,1) .3s forwards;
    }

    .light-sweep {
      position: absolute;
      z-index: 2;
      width: 34%;
      height: 150%;
      top: -25%;
      left: -42%;
      transform: rotate(18deg);
      background: linear-gradient(to right, transparent, rgba(255,255,255,.66), rgba(241, 190, 255, .28), transparent);
      filter: blur(6px);
      opacity: 0;
      animation: sweep 3.2s ease-in-out 1.7s forwards;
      pointer-events: none;
    }

    .mist {
      position: absolute;
      inset: auto -20% -18% -20%;
      z-index: 2;
      height: 55%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(217, 70, 239, .39), rgba(168, 85, 247, .12) 42%, transparent 70%);
      filter: blur(14px);
      opacity: 0;
      animation: mistRise 4.5s ease-out 1.3s forwards;
      pointer-events: none;
    }

    .message {
      position: absolute;
      z-index: 5;
      left: 1.75rem;
      right: 1.75rem;
      bottom: 1.65rem;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: messageIn 1.3s ease-out 4.4s forwards;
    }

    .petal {
      position: absolute;
      z-index: 6;
      width: 10px;
      height: 15px;
      border-radius: 90% 20% 90% 20%;
      background: linear-gradient(145deg, #fbcfe8, #c084fc);
      box-shadow: 0 0 12px rgba(244,114,182,.8);
      opacity: 0;
      pointer-events: none;
      animation: floatPetal var(--duration) ease-in var(--delay) infinite;
    }

    .p1 { left: 10%; top: 20%; --duration: 6s; --delay: 1s; }
    .p2 { left: 77%; top: 18%; --duration: 7.5s; --delay: 2.4s; transform: rotate(40deg); }
    .p3 { left: 88%; top: 52%; --duration: 6.8s; --delay: .5s; transform: rotate(85deg); }
    .p4 { left: 17%; top: 61%; --duration: 8s; --delay: 3.4s; transform: rotate(-25deg); }
    .p5 { left: 55%; top: 5%; --duration: 7s; --delay: 2s; transform: rotate(20deg); }
    .p6 { left: 42%; top: 39%; --duration: 8.2s; --delay: 4s; transform: rotate(115deg); }

    .spark {
      position: absolute;
      z-index: 6;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 10px 3px rgba(245, 208, 254, .85);
      pointer-events: none;
      animation: twinkle var(--time) ease-in-out var(--wait) infinite;
    }

    .s1 { top: 13%; left: 23%; --time: 2.7s; --wait: .5s; }
    .s2 { top: 28%; left: 84%; --time: 3.4s; --wait: 1.2s; }
    .s3 { top: 67%; left: 8%; --time: 2.1s; --wait: 2s; }
    .s4 { top: 75%; left: 79%; --time: 3s; --wait: .2s; }
    .s5 { top: 42%; left: 13%; --time: 2.8s; --wait: 1.8s; }
    .s6 { top: 8%; left: 64%; --time: 3.7s; --wait: 2.7s; }
    .s7 { top: 48%; left: 71%; --time: 2.5s; --wait: .7s; }
    .s8 { top: 87%; left: 36%; --time: 3.1s; --wait: 3s; }

    .replay-icon {
      transition: transform .45s ease;
    }

    .replay-button:hover .replay-icon,
    .replay-button:focus-visible .replay-icon {
      transform: rotate(180deg);
    }

    .is-replaying .photo-layer,
    .is-replaying .photo-layer img,
    .is-replaying .light-sweep,
    .is-replaying .mist,
    .is-replaying .message {
      animation: none;
    }

    .is-replaying .photo-layer {
      clip-path: circle(0% at 50% 56%);
    }

    .is-replaying .photo-layer img {
      transform: scale(1.25);
      filter: saturate(.8) blur(9px) brightness(.6);
    }

    .is-replaying .light-sweep,
    .is-replaying .mist,
    .is-replaying .message {
      opacity: 0;
    }

    .is-replaying.run .photo-layer { animation: bloom 5.8s cubic-bezier(.16,.85,.25,1) .3s forwards; }
    .is-replaying.run .photo-layer img { animation: focus 5.8s cubic-bezier(.16,.85,.25,1) .3s forwards; }
    .is-replaying.run .light-sweep { animation: sweep 3.2s ease-in-out 1.7s forwards; }
    .is-replaying.run .mist { animation: mistRise 4.5s ease-out 1.3s forwards; }
    .is-replaying.run .message { animation: messageIn 1.3s ease-out 4.4s forwards; }

    @keyframes bloom {
      0% { clip-path: circle(0% at 50% 56%); }
      48% { clip-path: circle(36% at 50% 56%); }
      100% { clip-path: circle(104% at 50% 56%); }
    }

    @keyframes focus {
      0% { transform: scale(1.25); filter: saturate(.8) blur(9px) brightness(.6); }
      55% { filter: saturate(1.15) blur(2px) brightness(.95); }
      100% { transform: scale(1); filter: saturate(1.14) blur(0) brightness(1); }
    }

    @keyframes sweep {
      0% { left: -42%; opacity: 0; }
      17% { opacity: .65; }
      76% { opacity: .4; }
      100% { left: 115%; opacity: 0; }
    }

    @keyframes mistRise {
      0% { transform: translateY(75px) scale(.8); opacity: 0; }
      55% { opacity: .8; }
      100% { transform: translateY(-24px) scale(1.1); opacity: .32; }
    }

    @keyframes messageIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatPetal {
      0% { opacity: 0; translate: 0 -12px; rotate: 0deg; }
      12% { opacity: .95; }
      86% { opacity: .72; }
      100% { opacity: 0; translate: 34px 215px; rotate: 220deg; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.55); }
      48% { opacity: 1; transform: scale(1.8); }
    }

    @keyframes breathe {
      to { transform: scale(1.14) translate(10px, 4px); opacity: .8; }
    }

    @keyframes settle {
      to { transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .photo-layer { clip-path: circle(104% at 50% 56%); }
      .photo-layer img { transform: scale(1); filter: saturate(1.14) blur(0) brightness(1); }
      .message { opacity: 1; transform: none; }
    }
  </style>

 <body data-template-id="__page-root">
  <div class="app-shell flex min-h-screen w-full flex-col items-center justify-between px-5 py-7 sm:px-8">
   <div class="ambient ambient-one"></div>
   <div class="ambient ambient-two"></div>
   <div class="star-field"></div>
   <header class="relative z-10 flex w-full max-w-md items-center justify-center">

   <main class="relative z-10 flex w-full flex-1 flex-col items-center justify-center py-6" aria-label="Revelação de uma imagem romântica">

     <div class="light-sweep"></div><span class="petal p1" aria-hidden="true"></span> <span class="petal p2" aria-hidden="true"></span> <span class="petal p3" aria-hidden="true"></span> <span class="petal p4" aria-hidden="true"></span> <span class="petal p5" aria-hidden="true"></span> <span class="petal p6" aria-hidden="true"></span> <span class="spark s1" aria-hidden="true"></span> <span class="spark s2" aria-hidden="true"></span> <span class="spark s3" aria-hidden="true"></span> <span class="spark s4" aria-hidden="true"></span> <span class="spark s5" aria-hidden="true"></span> <span class="spark s6" aria-hidden="true"></span> <span class="spark s7" aria-hidden="true"></span> <span class="spark s8" aria-hidden="true"></span>
     <div class="message">
      <p data-template-id="message-line-one" class="canva-text mb-1 font-medium leading-tight"></p>
      <p data-template-id="message-line-two" class="canva-text leading-tight"></p>
     </div>
    </section><button data-template-id="replay-button" id="replay-button" type="button" class="replay-button canva-button mt-7 inline-flex items-center gap-2 rounded-full px-5 py-3 font-['Space_Mono'] text-xs uppercase tracking-[0.13em] shadow-lg transition duration-300 hover:-translate-y-0.5 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4"> <i class="replay-icon h-4 w-4" data-lucide="rotate-ccw" aria-hidden="true"></i> <span data-template-id="replay-label" class="canva-text"></span> </button>
   </main>
   <footer class="relative z-10 text-center">
    <p data-template-id="footer-text" class="canva-text text-base italic"></p>
   </footer>
  </div>
  <script src="/_sdk/a051f9537983733d.editing_sdk.js" integrity="sha512-IWn3eBHnVt7zQ0Rp79J72qSgJoLbskCA9lcfY4retf+5km4LjuhSHpvx+182KCHmEZ6EbJtWqVsybpV8Sd8PQQ=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const stage = document.getElementById("reveal-stage");
      const replayButton = document.getElementById("replay-button");

      replayButton.addEventListener("click", () => {
        stage.classList.remove("run");
        stage.classList.add("is-replaying");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            stage.classList.add("run");
          });
        });

        window.setTimeout(() => {
          stage.classList.remove("is-replaying", "run");
        }, 6500);
      });
    });
  </script>
