<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Revelação Romântica - Tela Cheia</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ink: #08020d;
      --violet: #a855f7;
      --pink: #f472b6;
      --lavender: #e9d5ff;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--ink);
      font-family: "Alegreya", serif;
    }

    /* Container Principal - Occupy Fullscreen */
    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    /* Fundo dinâmico com brilhos */
    .ambient {
      position: absolute;
      border-radius: 999px;
      filter: blur(60px);
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
      animation: breathe 7s ease-in-out infinite alternate;
    }

    .ambient-one {
      width: 40vw;
      height: 40vw;
      top: -10vw;
      left: -10vw;
      background: #7e22ce;
    }

    .ambient-two {
      width: 45vw;
      height: 45vw;
      bottom: -10vw;
      right: -10vw;
      background: #be185d;
      animation-delay: -3.5s;
    }

    /* Estágio de Revelação em Tela Toda */
    .reveal-stage {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      overflow: hidden;
    }

    /* Gradiente de proteção para texto */
    .reveal-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        to top, 
        rgba(8, 2, 13, 0.92) 0%, 
        rgba(8, 2, 13, 0.3) 40%, 
        rgba(8, 2, 13, 0.4) 100%
      );
    }

    /* Camada da Foto com Animação de Revelação */
    .photo-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0925;
      clip-path: circle(0% at 50% 50%);
      animation: bloom 5.5s cubic-bezier(.16,.85,.25,1) 0.3s forwards;
    }

    .photo-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.3);
      filter: saturate(.7) blur(12px) brightness(.5);
      animation: focus 5.5s cubic-bezier(.16,.85,.25,1) 0.3s forwards;
    }

    /* Varrida de Luz Magnífica */
    .light-sweep {
      position: absolute;
      z-index: 4;
      width: 50vw;
      height: 200vh;
      top: -50vh;
      left: -60vw;
      transform: rotate(25deg);
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.7), rgba(241, 190, 255, 0.4), transparent);
      filter: blur(10px);
      opacity: 0;
      animation: sweep 3.5s ease-in-out 1.5s forwards;
      pointer-events: none;
    }

    /* Névoa Mística */
    .mist {
      position: absolute;
      inset: auto -10% -10% -10%;
      z-index: 4;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(217, 70, 239, .35), rgba(168, 85, 247, .15) 50%, transparent 75%);
      filter: blur(25px);
      opacity: 0;
      animation: mistRise 5s ease-out 1s forwards;
      pointer-events: none;
    }

    /* Estrelas Brilhantes (Sparks) espalhadas pela tela */
    .spark {
      position: absolute;
      z-index: 6;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 12px 4px rgba(245, 208, 254, .9);
      pointer-events: none;
      animation: twinkle var(--time) ease-in-out var(--wait) infinite;
    }

    /* Pétalas Caindo em Tela Toda */
    .petal {
      position: absolute;
      z-index: 6;
      width: 14px;
      height: 20px;
      border-radius: 90% 20% 90% 20%;
      background: linear-gradient(145deg, #fbcfe8, #c084fc);
      box-shadow: 0 0 14px rgba(244,114,182,.8);
      opacity: 0;
      pointer-events: none;
      animation: floatPetal var(--duration) ease-in var(--delay) infinite;
    }

    /* Posições das Pétalas */
    .p1 { left: 8%;  top: -5%; --duration: 7s;   --delay: 0.5s; }
    .p2 { left: 25%; top: -5%; --duration: 8.5s; --delay: 2s;   }
    .p3 { left: 45%; top: -5%; --duration: 6.5s; --delay: 1.2s; }
    .p4 { left: 65%; top: -5%; --duration: 9s;   --delay: 3s;   }
    .p5 { left: 82%; top: -5%; --duration: 7.5s; --delay: 0.2s; }
    .p6 { left: 93%; top: -5%; --duration: 8s;   --delay: 2.5s; }

    /* Posições das Estrelas */
    .s1 { top: 15%; left: 15%; --time: 2.5s; --wait: 0.2s; }
    .s2 { top: 25%; left: 80%; --time: 3.2s; --wait: 1.0s; }
    .s3 { top: 65%; left: 10%; --time: 2.2s; --wait: 1.8s; }
    .s4 { top: 75%; left: 85%; --time: 3.0s; --wait: 0.5s; }
    .s5 { top: 40%; left: 20%; --time: 2.8s; --wait: 1.5s; }
    .s6 { top: 10%; left: 60%; --time: 3.5s; --wait: 2.2s; }
    .s7 { top: 50%; left: 75%; --time: 2.4s; --wait: 0.8s; }
    .s8 { top: 85%; left: 40%; --time: 3.1s; --wait: 2.8s; }

    /* Mensagem Final */
    .message {
      position: absolute;
      z-index: 10;
      left: 1rem;
      right: 1rem;
      bottom: 6rem;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: messageIn 1.5s ease-out 4.2s forwards;
      pointer-events: none;
    }

    /* Botão de Replay Reestilizado */
    .replay-button-container {
      position: absolute;
      bottom: 2rem;
      z-index: 20;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .replay-button {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transition: all 0.4s ease;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .replay-button:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 40px 0 rgba(168, 85, 247, 0.4);
    }

    .replay-icon {
      transition: transform 0.6s ease;
    }

    .replay-button:hover .replay-icon {
      transform: rotate(180deg);
    }

    /* Keyframes de Animação */
    @keyframes bloom {
      0% { clip-path: circle(0% at 50% 50%); }
      100% { clip-path: circle(120% at 50% 50%); }
    }

    @keyframes focus {
      0% { transform: scale(1.3); filter: saturate(.7) blur(12px) brightness(.5); }
      50% { filter: saturate(1.2) blur(3px) brightness(.95); }
      100% { transform: scale(1); filter: saturate(1.15) blur(0) brightness(1); }
    }

    @keyframes sweep {
      0% { left: -60vw; opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.5; }
      100% { left: 120vw; opacity: 0; }
    }

    @keyframes mistRise {
      0% { transform: translateY(80px) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-30px) scale(1.1); opacity: 0.35; }
    }

    @keyframes messageIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatPetal {
      0% { opacity: 0; transform: translateY(0) rotate(0deg) translateX(0); }
      10% { opacity: 0.9; }
      90% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(105vh) rotate(360deg) translateX(50px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(2); box-shadow: 0 0 18px 6px rgba(245, 208, 254, 1); }
    }

    @keyframes breathe {
      to { transform: scale(1.2) translate(20px, -10px); opacity: 0.8; }
    }

    /* Estado de Reinício do Replay */
    .is-replaying .photo-layer,
    .is-replaying .photo-layer img,
    .is-replaying .light-sweep,
    .is-replaying .mist,
    .is-replaying .message {
      animation: none !important;
    }

    .is-replaying .photo-layer { clip-path: circle(0% at 50% 50%); }
    .is-replaying .photo-layer img { transform: scale(1.3); filter: saturate(.7) blur(12px) brightness(.5); }
    .is-replaying .light-sweep,
    .is-replaying .mist,
    .is-replaying .message { opacity: 0; }

    .is-replaying.run .photo-layer { animation: bloom 5.5s cubic-bezier(.16,.85,.25,1) 0.3s forwards !important; }
    .is-replaying.run .photo-layer img { animation: focus 5.5s cubic-bezier(.16,.85,.25,1) 0.3s forwards !important; }
    .is-replaying.run .light-sweep { animation: sweep 3.5s ease-in-out 1.5s forwards !important; }
    .is-replaying.run .mist { animation: mistRise 5s ease-out 1s forwards !important; }
    .is-replaying.run .message { animation: messageIn 1.5s ease-out 4.2s forwards !important; }
  </style>
</head>

<body>
  <div class="app-shell">
    
    <!-- Luzes de Fundo -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <!-- Canvas de Partículas Dinâmicas do Fundo -->
    <canvas id="starsCanvas" class="absolute inset-0 z-1 pointer-events-none"></canvas>

    <!-- Cabeçalho Flutuante -->
    <header class="relative z-10 pt-6 text-center w-full">
      <p data-template-id="eyebrow-text" class="canva-text font-['Space_Mono'] text-xs uppercase tracking-[0.3em] text-purple-200 drop-shadow-md">
        Uma surpresa para você
      </p>
    </header>

    <!-- Palco Principal (TELA TODA) -->
    <main class="reveal-stage" id="reveal-stage" aria-label="Revelação Romântica">
      
      <!-- Camada da Imagem -->
      <div class="photo-layer">
        <img data-template-id="romantic-image" class="canva-image" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop" alt="Foto Romântica">
      </div>

      <!-- Efeitos Visuais -->
      <div class="mist"></div>
      <div class="light-sweep"></div>

      <!-- Pétalas Caindo -->
      <span class="petal p1" aria-hidden="true"></span>
      <span class="petal p2" aria-hidden="true"></span>
      <span class="petal p3" aria-hidden="true"></span>
      <span class="petal p4" aria-hidden="true"></span>
      <span class="petal p5" aria-hidden="true"></span>
      <span class="petal p6" aria-hidden="true"></span>

      <!-- Estrelas Brilhantes -->
      <span class="spark s1" aria-hidden="true"></span>
      <span class="spark s2" aria-hidden="true"></span>
      <span class="spark s3" aria-hidden="true"></span>
      <span class="spark s4" aria-hidden="true"></span>
      <span class="spark s5" aria-hidden="true"></span>
      <span class="spark s6" aria-hidden="true"></span>
      <span class="spark s7" aria-hidden="true"></span>
      <span class="spark s8" aria-hidden="true"></span>

      <!-- Mensagem Romântica -->
      <div class="message">
        <p data-template-id="message-line-one" class="canva-text text-2xl sm:text-4xl font-medium leading-tight text-white drop-shadow-lg">
          Você é o meu momento favorito
        </p>
        <p data-template-id="message-line-two" class="canva-text text-lg sm:text-xl text-purple-200 italic mt-2 drop-shadow-md">
          Para todo o sempre... ❤️
        </p>
      </div>
    </main>

    <!-- Botão de Replay Flutuante -->
    <div class="replay-button-container">
      <button data-template-id="replay-button" id="replay-button" type="button" class="replay-button canva-button inline-flex items-center gap-3 rounded-full px-6 py-3.5 font-['Space_Mono'] text-xs uppercase tracking-[0.15em] cursor-pointer">
        <i class="replay-icon h-4 w-4" data-lucide="rotate-ccw" aria-hidden="true"></i>
        <span data-template-id="replay-label" class="canva-text">Reviver Momento</span>
      </button>
    </div>

    <!-- Rodapé Discreto -->
    <footer class="relative z-10 pb-2 text-center">
      <p data-template-id="footer-text" class="canva-text text-xs text-purple-300/60 italic"></p>
    </footer>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Inicializar Ícones Lucide
      if (window.lucide) {
        lucide.createIcons();
      }

      // Lógica de Replay
      const stage = document.getElementById("reveal-stage");
      const replayButton = document.getElementById("replay-button");

      replayButton.addEventListener("click", () => {
        stage.classList.remove("run");
        stage.classList.add("is-replaying");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            stage.classList.add("run");
          });
        });

        window.setTimeout(() => {
          stage.classList.remove("is-replaying", "run");
        }, 6000);
      });

      // Canvas de Fundo de Estrelas / Vaga-lumes Dinâmicos
      const canvas = document.getElementById('starsCanvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      class Star {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.alpha = Math.random();
          this.speed = Math.random() * 0.01 + 0.005;
          this.dir = Math.random() > 0.5 ? 1 : -1;
        }
        update() {
          this.alpha += this.speed * this.dir;
          if (this.alpha >= 1 || this.alpha <= 0.1) {
            this.dir *= -1;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
          ctx.fill();
        }
      }

      const stars = Array.from({ length: 60 }, () => new Star());

      function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
          star.update();
          star.draw();
        });
        requestAnimationFrame(animateStars);
      }
      animateStars();
    });
  </script>
</body>
</html>
