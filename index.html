<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma Flores</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --night: #080d2b;
      --wine: #310d2d;
      --violet: #261541;
      --leaf: #2f7448;
      --leaf-light: #75b76b;
      --rose: #b31247;
      --rose-light: #fa5e8b;
      --lilac: #c99ae9;
      --gold: #ffd96e;
      --rose-glow: #ff6b9d;
      --purple-deep: #4a148c;
    }

    * { box-sizing: border-box; }
    html { 
      background: var(--night);
      overflow-x: hidden;
    }
    body {
      width: 100%;
      min-height: 100vh;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      margin: 0;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff7ee;
    }

    button { font: inherit; }
    .scene {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 73% 20%, rgba(174, 124, 214, .22), transparent 18%),
        radial-gradient(circle at 50% 110%, rgba(111, 19, 65, .58), transparent 45%),
        linear-gradient(155deg, #071331 0%, #171242 43%, #461337 100%);
    }

    .scene::before {
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: .5;
      z-index: -1;
    }

    /* Aurora Boreal */
    .aurora {
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120%;
      height: 60%;
      background: 
        radial-gradient(ellipse at 50% 0%, rgba(186, 104, 200, 0.15), transparent 70%),
        radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.1), transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(255, 105, 180, 0.08), transparent 65%);
      filter: blur(40px);
      animation: auroraFlow 15s ease-in-out infinite alternate;
      z-index: 0;
      opacity: 0.6;
    }

    .moon {
      position: absolute; top: 9%; right: 13%;
      width: clamp(72px, 11vw, 148px); aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 32%, #fffdf2 0 9%, #f6e6c9 45%, #d7b6d0 100%);
      box-shadow: 0 0 35px 12px rgba(249, 224, 214, .32), 0 0 100px 24px rgba(190, 145, 220, .16), 0 0 180px 60px rgba(255, 192, 203, 0.1);
      animation: moonPulse 5s ease-in-out infinite;
      z-index: 1;
    }
    .moon::after {
      content: "";
      position: absolute; width: 27%; height: 16%; top: 25%; left: 50%;
      border-radius: 50%; background: rgba(174, 135, 156, .15);
      filter: blur(3px);
    }
    .moon::before {
      content: "";
      position: absolute; width: 15%; height: 10%; top: 45%; left: 65%;
      border-radius: 50%; background: rgba(174, 135, 156, .12);
      filter: blur(2px);
    }

    .star-field, .fireflies { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .star {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: #fff8da; box-shadow: 0 0 8px 2px rgba(255,246,202,.7);
      animation: twinkle var(--speed) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    .s1 { top: 15%; left: 11%; } .s2 { top: 28%; left: 24%; } .s3 { top: 10%; left: 48%; }
    .s4 { top: 38%; left: 79%; } .s5 { top: 23%; left: 91%; } .s6 { top: 50%; left: 7%; }
    .s7 { top: 58%; left: 28%; } .s8 { top: 17%; left: 65%; } .s9 { top: 42%; left: 58%; }
    .s10 { top: 8%; left: 34%; } .s11 { top: 67%; left: 88%; } .s12 { top: 31%; left: 40%; }
    .s13 { top: 45%; left: 15%; } .s14 { top: 72%; left: 55%; } .s15 { top: 19%; left: 82%; }
    .s16 { top: 63%; left: 92%; } .s17 { top: 35%; left: 5%; } .s18 { top: 81%; left: 38%; }

    .firefly {
      position: absolute; width: 7px; height: 7px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 10px 4px rgba(255, 210, 82, .75), 0 0 20px 8px rgba(255, 215, 0, 0.4);
      animation: drift var(--drift) ease-in-out infinite, twinkle 1.7s ease-in-out infinite;
    }
    .f1 { left: 18%; top: 68%; --drift: 7s; } .f2 { left: 75%; top: 64%; --drift: 9s; animation-delay: -2s; }
    .f3 { left: 32%; top: 39%; --drift: 8s; animation-delay: -4s; } .f4 { left: 85%; top: 43%; --drift: 10s; animation-delay: -1s; }
    .f5 { left: 56%; top: 77%; --drift: 6s; animation-delay: -3s; } .f6 { left: 10%; top: 49%; --drift: 11s; animation-delay: -5s; }
    .f7 { left: 45%; top: 55%; --drift: 8.5s; animation-delay: -2.5s; } .f8 { left: 68%; top: 72%; --drift: 9.5s; animation-delay: -3.5s; }

    .mist {
      position: absolute; left: -10%; bottom: 13%; width: 120%; height: 21%;
      border-radius: 50%; filter: blur(24px);
      background: linear-gradient(90deg, transparent, rgba(231, 187, 239, .12), rgba(255, 221, 209, .16), transparent);
      animation: mistMove 12s ease-in-out infinite alternate;
      z-index: 2;
    }

    .mist-2 {
      position: absolute; left: -15%; bottom: 25%; width: 130%; height: 18%;
      border-radius: 50%; filter: blur(30px);
      background: linear-gradient(90deg, transparent, rgba(186, 104, 200, .08), rgba(255, 182, 193, .12), transparent);
      animation: mistMove 16s ease-in-out infinite alternate-reverse;
      z-index: 2;
    }

    .garden-stage {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      transform-origin: bottom center;
      z-index: 5;
    }

    .grass {
      position: absolute; z-index: 1; bottom: -2px; width: 115%; height: 18%;
      background:
        repeating-linear-gradient(104deg, transparent 0 10px, rgba(83,150,87,.52) 11px 12px, transparent 13px 24px),
        linear-gradient(to top, #122d2c 0%, #1c473c 45%, #2d5a4a 75%, transparent 100%);
      clip-path: polygon(0 44%, 3% 33%, 5% 49%, 8% 23%, 10% 48%, 14% 30%, 17% 52%, 21% 22%, 23% 47%, 28% 26%, 31% 53%, 36% 20%, 39% 49%, 44% 28%, 47% 50%, 52% 17%, 55% 48%, 60% 23%, 63% 51%, 68% 24%, 71% 48%, 76% 21%, 80% 52%, 84% 31%, 88% 47%, 92% 20%, 95% 49%, 100% 29%, 100% 100%, 0 100%);
      box-shadow: 0 -10px 40px rgba(45, 90, 74, 0.5);
    }

    .grass-glow {
      position: absolute; z-index: 1; bottom: 0; width: 100%; height: 15%;
      background: radial-gradient(ellipse at 50% 100%, rgba(120, 200, 140, 0.15), transparent 70%);
      filter: blur(20px);
      animation: grassGlow 4s ease-in-out infinite alternate;
    }

    .plant {
      position: relative; z-index: 3; width: min(520px, 94vw); height: min(660px, 76vh);
      transform-origin: bottom center;
    }
    .plant::after {
      content: ""; position: absolute; left: 50%; bottom: 1%; width: 210px; height: 28px;
      transform: translateX(-50%); border-radius: 50%;
      background: rgba(0,0,0,.35); filter: blur(13px);
    }

    .stem {
      position: absolute; left: 50%; bottom: 3%; width: 14px; height: 65%;
      transform: translateX(-50%) scaleY(0); transform-origin: bottom;
      border-radius: 50% 50% 30% 30%;
      background: linear-gradient(90deg, #164727, #75ad58 45%, #1b572e 76%, #2d6b3f);
      box-shadow: inset 3px 0 3px rgba(255,255,255,.25), 0 0 15px rgba(78,157,82,.4), 0 0 30px rgba(120, 200, 140, 0.2);
      animation: growStem 3.1s cubic-bezier(.2,.9,.25,1) forwards;
    }
    .stem::before {
      content: "";
      position: absolute; top: 10%; left: 20%; width: 30%; height: 80%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
      border-radius: 50%;
      filter: blur(2px);
    }

    .branch {
      position: absolute; bottom: 38%; left: 50%; width: 11px; height: 35%;
      border-radius: 100% 0 0 0;
      background: linear-gradient(90deg, #20572e, #73ab57, #3d8b5a);
      transform-origin: bottom;
      box-shadow: 0 0 10px rgba(100, 180, 100, 0.3);
      animation: growBranch 1.1s ease-out forwards;
    }
    .branch.left { transform: rotate(-53deg) scaleY(0); animation-delay: 2.2s; }
    .branch.right { transform: rotate(52deg) scaleY(0); animation-delay: 2.55s; bottom: 47%; }

    .leaf {
      position: absolute; width: 86px; height: 42px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(140deg, #91c770, #29663c 72%, #1a4a2a);
      box-shadow: inset 5px 2px 8px rgba(255,255,255,.35), inset -3px -3px 10px rgba(0,0,0,.3), 2px 6px 12px rgba(0,0,0,.25), 0 0 15px rgba(120, 200, 140, 0.3);
      opacity: 0; transform: scale(0) rotate(var(--rotation));
      animation: leafBloom .8s cubic-bezier(.16,.95,.32,1) forwards;
      transition: transform 0.3s ease;
    }
    .leaf::before {
      content: "";
      position: absolute; top: 5%; left: 10%; width: 80%; height: 90%;
      background: linear-gradient(140deg, rgba(180, 230, 180, 0.4), transparent 60%);
      border-radius: 100% 0 100% 0;
      filter: blur(1px);
    }
    .leaf::after { 
      content: ""; 
      position: absolute; height: 2px; width: 94%; top: 50%; 
      background: linear-gradient(90deg, transparent, rgba(234,255,209,.7), transparent); 
      transform: rotate(-25deg);
      box-shadow: 0 0 8px rgba(200, 255, 200, 0.6);
    }
    .leaf:hover {
      transform: scale(1.08) rotate(calc(var(--rotation) + 5deg));
    }
    .l1 { bottom: 35%; left: 26%; --rotation: -28deg; animation-delay: 2.7s; }
    .l2 { bottom: 49%; right: 22%; --rotation: 119deg; animation-delay: 3.05s; }
    .l3 { bottom: 57%; left: 31%; width: 68px; height: 34px; --rotation: -31deg; animation-delay: 3.3s; }
    .l4 { bottom: 24%; right: 26%; width: 72px; height: 37px; --rotation: 119deg; animation-delay: 3.5s; }
    .l5 { bottom: 65%; left: 18%; width: 62px; height: 30px; --rotation: -35deg; animation-delay: 3.7s; }
    .l6 { bottom: 18%; right: 20%; width: 66px; height: 32px; --rotation: 125deg; animation-delay: 3.9s; }

    .flower {

      opacity: 0; transform: scale(.1); transform-origin: center bottom;
