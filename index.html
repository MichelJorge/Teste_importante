<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Um Buquê Especial Para Você</title>
<style>
  :root {
    --bg-gradient: radial-gradient(circle at 50% 30%, #fffdfa 0%, #f4eae1 50%, #e8d9cb 100%);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-gradient);
    font-family: 'Georgia', serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  .stage {
    width: 100%;
    max-width: 500px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 10px;
  }

  .bouquet-svg {
    width: 100%;
    height: auto;
    max-height: 75vh;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
  }

  /* Animações CSS */
  @keyframes growStem { to { stroke-dashoffset: 0; } }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } }
  @keyframes bloom {
    0% { opacity: 0; transform: scale(0) rotate(-20deg); }
    60% { opacity: 1; transform: scale(1.1) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes floatHeart {
    0% { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
    50% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-120px) scale(1.2) rotate(25deg); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }
  @keyframes captionIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseGlow {
    0%, 100% { text-shadow: 0 0 10px rgba(212, 143, 56, 0.3); }
    50% { text-shadow: 0 0 22px rgba(212, 143, 56, 0.7); }
  }

  .stem {
    fill: none;
    stroke: #3a5a24;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: growStem 1.2s ease-out forwards;
  }

  .flower, .card {
    opacity: 0;
    transform-origin: center;
    transform-box: fill-box;
    animation: bloom 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .leaf, .wrap {
    opacity: 0;
    transform-origin: center;
    transform-box: fill-box;
    animation: popIn 0.8s ease-out forwards;
  }

  #swayGroup {
    transform-origin: 200px 520px;
    animation: sway 4s ease-in-out infinite alternate;
  }

  .caption {
    opacity: 0;
    transform: translateY(15px);
    margin-top: 10px;
    text-align: center;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(1.4rem, 5vw, 2.1rem);
    color: #4a2810;
    animation: captionIn 1s ease-out 3.5s forwards, pulseGlow 3s ease-in-out 4.5s infinite;
  }

  .heart-particle {
    position: absolute;
    pointer-events: none;
    color: #e63946;
    font-size: 18px;
    animation: floatHeart 3s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg class="bouquet-svg" viewBox="0 0 400 600">
    <defs>
      <!-- Gradientes e Filtros -->
      <linearGradient id="kraftPaper" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#d7a15c"/>
        <stop offset="100%" stop-color="#a37035"/>
      </linearGradient>
      
      <linearGradient id="blackPaper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2b2b2b"/>
        <stop offset="100%" stop-color="#111111"/>
      </linearGradient>

      <radialGradient id="sunCenter" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2a1202"/>
        <stop offset="70%" stop-color="#4a2408"/>
        <stop offset="100%" stop-color="#1a0a01"/>
      </radialGradient>

      <radialGradient id="blueRose" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#6ba4e8"/>
        <stop offset="50%" stop-color="#1d59b3"/>
        <stop offset="100%" stop-color="#0b2866"/>
      </radialGradient>

      <!-- Cartão Noite Estrelada -->
      <linearGradient id="starrySky" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0e2a47"/>
        <stop offset="50%" stop-color="#1b4975"/>
        <stop offset="100%" stop-color="#08182b"/>
      </linearGradient>

      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.3"/>
      </filter>
    </defs>

    <g id="swayGroup">
      <!-- Caules -->
      <g id="stemsLayer">
        <path class="stem" d="M 200 520 Q 190 400 130 280" style="animation-delay: 0.1s;"/>
        <path class="stem" d="M 200 520 Q 200 380 200 240" style="animation-delay: 0.2s;"/>
        <path class="stem" d="M 200 520 Q 210 400 280 270" style="animation-delay: 0.3s;"/>
        <path class="stem" d="M 200 520 Q 180 420 100 220" style="animation-delay: 0.15s;"/>
        <path class="stem" d="M 200 520 Q 220 420 300 210" style="animation-delay: 0.25s;"/>
      </g>

      <!-- Papel de Embrulho (Fundo Escuro e Pardo) -->
      <g id="wrapLayer">
        <!-- Papel Preto Interno -->
        <path class="wrap" d="M 200 520 L 80 260 L 320 260 Z" fill="url(#blackPaper)" style="animation-delay: 0.5s;"/>
        <!-- Papel Kraft Externo -->
        <path class="wrap" d="M 200 530 L 40 320 L 120 480 Z" fill="url(#kraftPaper)" filter="url(#shadow)" style="animation-delay: 0.6s;"/>
        <path class="wrap" d="M 200 530 L 360 320 L 280 480 Z" fill="url(#kraftPaper)" filter="url(#shadow)" style="animation-delay: 0.7s;"/>
        <path class="wrap" d="M 200 530 L 60 340 L 340 340 Z" fill="url(#kraftPaper)" style="animation-delay: 0.8s;"/>
      </g>

      <!-- Cartão Van Gogh (A Noite Estrelada) -->
      <g class="card" transform="translate(60, 110) rotate(-18)" filter="url(#shadow)" style="animation-delay: 1.2s;">
        <rect x="0" y="0" width="70" height="90" rx="3" fill="url(#starrySky)" stroke="#fff" stroke-width="1.5"/>
        <!-- Sol/Lua de Van Gogh -->
        <circle cx="55" cy="20" r="10" fill="#ffd13b" opacity="0.9"/>
        <circle cx="55" cy="20" r="6" fill="#fff59d"/>
        <!-- Espirais de Vento -->
        <path d="M 10 30 C 25 15, 35 40, 50 25" fill="none" stroke="#5cb3ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        <path d="M 5 45 C 20 30, 40 55, 60 35" fill="none" stroke="#eedd82" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <!-- Cipreste Escuro -->
        <path d="M 8 90 Q 15 50 22 90 Z" fill="#09200f"/>
      </g>

      <!-- Preenchimentos Verdes e Amarelinhos (Gipsonas) -->
      <g id="foliageLayer">
        <!-- Folhagens Amarelas/Verdes (Solidago) -->
        <g class="leaf" transform="translate(240, 150)" style="animation-delay: 1.0s;">
          <circle cx="0" cy="0" r="3" fill="#e2c044"/><circle cx="5" cy="-5" r="2.5" fill="#e2c044"/><circle cx="-4" cy="-8" r="3" fill="#88aa22"/>
        </g>
        <g class="leaf" transform="translate(140, 180)" style="animation-delay: 1.1s;">
          <circle cx="0" cy="0" r="4" fill="#e2c044"/><circle cx="-6" cy="-4" r="3" fill="#e2c044"/><circle cx="5" cy="-6" r="3.5" fill="#88aa22"/>
        </g>
        <!-- Flores Brancas Pequenas -->
        <g class="leaf" transform="translate(160, 320)" style="animation-delay: 1.3s;">
          <circle cx="0" cy="0" r="5" fill="#ffffff"/><circle cx="8" cy="3" r="4" fill="#ffffff"/><circle cx="4" cy="-6" r="4.5" fill="#ffffff"/>
          <circle cx="0" cy="0" r="1.5" fill="#ddb033"/>
        </g>
      </g>

      <!-- Camada de Flores Principais -->
      <g id="flowersLayer">
        
        <!-- Rosas Azuis -->
        <!-- Rosa Azul Superior -->
        <g class="flower" transform="translate(230, 160) scale(0.85)" style="animation-delay: 1.5s;">
          <circle cx="0" cy="0" r="25" fill="url(#blueRose)" filter="url(#shadow)"/>
          <path d="M -10 -5 C -5 -20, 5 -20, 10 -5 C 15 10, -15 10, -10 -5 Z" fill="#9bc2f7" opacity="0.6"/>
        </g>

        <!-- Rosa Azul Central Direita -->
        <g class="flower" transform="translate(280, 220) scale(1.1)" style="animation-delay: 1.7s;">
          <circle cx="0" cy="0" r="28" fill="url(#blueRose)" filter="url(#shadow)"/>
          <circle cx="-2" cy="-2" r="18" fill="#2b6cb0" opacity="0.5"/>
          <path d="M -8 -4 C -4 -15, 4 -15, 8 -4 Z" fill="#bbd7fb" opacity="0.8"/>
        </g>

        <!-- Rosa Azul Inferior Direita -->
        <g class="flower" transform="translate(290, 310) scale(1)" style="animation-delay: 1.9s;">
          <circle cx="0" cy="0" r="26" fill="url(#blueRose)" filter="url(#shadow)"/>
          <path d="M -6 -3 C -3 -12, 3 -12, 6 -3 Z" fill="#bbd7fb" opacity="0.7"/>
        </g>

        <!-- Rosa Azul Base Centro -->
        <g class="flower" transform="translate(220, 330) scale(0.95)" style="animation-delay: 2.1s;">
          <circle cx="0" cy="0" r="25" fill="url(#blueRose)" filter="url(#shadow)"/>
          <path d="M -6 -3 C -3 -12, 3 -12, 6 -3 Z" fill="#9bc2f7" opacity="0.8"/>
        </g>

        <!-- GRANDES GIRASSÓIS (Destaque Principal) -->
        
        <!-- Girassol 1: Superior Esquerdo -->
        <g class="flower" transform="translate(150, 200) scale(1.3)" style="animation-delay: 2.3s;">
          <g filter="url(#shadow)">
            <!-- Pétalas Amarelas -->
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(0)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(22.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(45)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(67.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(90)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(112.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(135)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(157.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(180)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(202.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(225)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(247.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(270)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(292.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(315)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffb300" transform="rotate(337.5)"/>
            <!-- Centro Marrom escuro -->
            <circle cx="0" cy="0" r="22" fill="url(#sunCenter)"/>
            <circle cx="0" cy="0" r="20" fill="none" stroke="#3a1a04" stroke-width="2" stroke-dasharray="3,3"/>
          </g>
        </g>

        <!-- Girassol 2: Centro Baixo (O Maior) -->
        <g class="flower" transform="translate(200, 270) scale(1.4)" style="animation-delay: 2.6s;">
          <g filter="url(#shadow)">
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(10)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(32.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(55)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(77.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(100)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(122.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(145)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(167.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(190)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(212.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(235)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(257.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(280)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(302.5)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffca28" transform="rotate(325)"/>
            <path d="M0,0 L-8,-45 L0,-50 L8,-45 Z" fill="#ffa000" transform="rotate(347.5)"/>
            <!-- Centro Marrom -->
            <circle cx="0" cy="0" r="23" fill="url(#sunCenter)"/>
            <circle cx="0" cy="0" r="21" fill="none" stroke="#54280a" stroke-width="2" stroke-dasharray="4,2"/>
          </g>
        </g>

        <!-- Girassol 3: Lateral Direita -->
        <g class="flower" transform="translate(310, 270) scale(1.1)" style="animation-delay: 2.9s;">
          <g filter="url(#shadow)">
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(5)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(30)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(55)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(80)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(105)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(130)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(155)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(180)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(205)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(230)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(255)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(280)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffca28" transform="rotate(305)"/>
            <path d="M0,0 L-7,-40 L0,-45 L7,-40 Z" fill="#ffb300" transform="rotate(330)"/>
            <circle cx="0" cy="0" r="19" fill="url(#sunCenter)"/>
          </g>
        </g>

      </g>
    </g>
  </svg>

  <div class="caption">Você é muito especial ❤️</div>
</div>

<script>
  // Gerador de corações flutuantes românticos
  function createHeart() {
    const stage = document.getElementById('stage');
    const heart = document.createElement('div');
    heart.classList.add('heart-particle');
    heart.innerHTML = ['❤️', '✨', '🌸', '💖'][Math.floor(Math.random() * 4)];
    
    // Posição aleatória na largura do buquê
    heart.style.left = (30 + Math.random() * 40) + '%';
    heart.style.top = (40 + Math.random() * 30) + '%';
    heart.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    
    stage.appendChild(heart);
    
    setTimeout(() => {
      heart.remove();
    }, 4500);
  }

  // Ativa os corações aos poucos após o desabrochar das flores
  setTimeout(() => {
    setInterval(createHeart, 600);
  }, 2500);

  // Reiniciar animação ao tocar na tela (ótimo para celular)
  document.body.addEventListener('click', () => {
    const elements = document.querySelectorAll('.stem, .flower, .leaf, .wrap, .card, .caption');
    elements.forEach(el => {
      el.style.animation = 'none';
      el.offsetHeight; // Trigger reflow
      el.style.animation = null;
    });
  });
</script>

</body>
</html>
