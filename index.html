<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flores Especiais</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --night: #05081c;
      --wine: #310d2d;
      --violet: #261541;
      --leaf: #2f7448;
      --leaf-light: #75b76b;
      --rose: #b31247;
      --rose-light: #fa5e8b;
      --lilac: #c99ae9;
      --gold: #ffd96e;
      --rose-glow: #ff6b9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { 
      width: 100%;
      height: 100%;
      background: var(--night);
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      color: #fff7ee;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: 100vw;
      height: 100dvh;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 73% 20%, rgba(174, 124, 214, .22), transparent 25%),
        radial-gradient(circle at 50% 110%, rgba(111, 19, 65, .58), transparent 50%),
        linear-gradient(155deg, #050b1e 0%, #120e34 43%, #380e2b 100%);
    }

    .scene::before {
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: .4;
      z-index: -1;
    }

    /* Aurora Boreal */
    .aurora {
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120%;
      height: 60%;
      background: 
        radial-gradient(ellipse at 50% 0%, rgba(186, 104, 200, 0.2), transparent 70%),
        radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.15), transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(255, 105, 180, 0.12), transparent 65%);
      filter: blur(40px);
      animation: auroraFlow 15s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes auroraFlow {
      0% { transform: translateY(0) scale(1); opacity: 0.5; }
      100% { transform: translateY(15px) scale(1.05); opacity: 0.8; }
    }

    .moon {
      position: absolute; 
      top: 6%; 
      right: 8%;
      width: clamp(65px, 14vw, 110px); 
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 32%, #fffdf2 0 10%, #f6e6c9 45%, #d7b6d0 100%);
      box-shadow: 0 0 35px 12px rgba(249, 224, 214, .3), 0 0 90px 20px rgba(190, 145, 220, .15);
      animation: moonPulse 6s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes moonPulse {
      0% { box-shadow: 0 0 35px 12px rgba(249, 224, 214, .3), 0 0 90px 20px rgba(190, 145, 220, .15); }
      100% { box-shadow: 0 0 45px 16px rgba(249, 224, 214, .45), 0 0 110px 30px rgba(190, 145, 220, .25); }
    }

    /* Estrelas e Vaga-lumes */
    .star-field, .fireflies { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    
    .star {
      position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%;
      background: #fff8da; box-shadow: 0 0 6px 1.5px rgba(255,246,202,.8);
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    .s1 { top: 12%; left: 15%; animation-delay: 0s; }
    .s2 { top: 25%; left: 30%; animation-delay: 0.5s; }
    .s3 { top: 8%; left: 55%; animation-delay: 1s; }
    .s4 { top: 35%; left: 80%; animation-delay: 1.5s; }
    .s5 { top: 18%; left: 88%; animation-delay: 2s; }
    .s6 { top: 48%; left: 10%; animation-delay: 2.5s; }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .firefly {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); 
      box-shadow: 0 0 12px 3px rgba(255, 210, 82, .9), 0 0 20px 6px rgba(255, 215, 0, 0.5);
      animation: drift 8s ease-in-out infinite alternate, twinkle 1.5s ease-in-out infinite alternate;
    }
    .f1 { left: 20%; top: 65%; animation-delay: 0s; }
    .f2 { left: 75%; top: 60%; animation-delay: -2s; }
    .f3 { left: 35%; top: 40%; animation-delay: -4s; }
    .f4 { left: 82%; top: 45%; animation-delay: -1s; }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(15px, -25px); }
    }

    /* Gramado e Palco */
    .garden-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      z-index: 5;
    }

    .grass {
      position: absolute; z-index: 1; bottom: -2px; width: 110%; height: 16%;
      background: linear-gradient(to top, #0d211e 0%, #163a31 50%, #234b3e 85%, transparent 100%);
      clip-path: polygon(0 44%, 5% 49%, 10% 48%, 17% 52%, 23% 47%, 31% 53%, 39% 49%, 47% 50%, 55% 48%, 63% 51%, 71% 48%, 80% 52%, 88% 47%, 95% 49%, 100% 29%, 100% 100%, 0 100%);
    }

    /* Planta / Flor Central */
    .plant {
      position: relative; z-index: 3; 
      width: min(340px, 85vw); 
      height: min(480px, 62vh);
      margin-bottom: 2vh;
      display: flex;
      justify-content: center;
    }

    .stem {
      position: absolute; bottom: 0; width: 10px; height: 70%;
      border-radius: 10px;
      background: linear-gradient(90deg, #164727, #75ad58 45%, #1b572e);
      box-shadow: 0 0 15px rgba(78,157,82,.4);
      transform-origin: bottom;
      animation: growStem 2.5s cubic-bezier(.2,.9,.25,1) forwards;
    }

    @keyframes growStem {
      0% { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }

    /* Botão de Flor Bonito */
    .flower-head {
      position: absolute; top: 15%;
      width: 140px; height: 140px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      animation: bloom 1.5s ease-out 2s forwards;
    }

    @keyframes bloom {
      0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .center-glow {
      position: absolute; width: 45px; height: 45px;
      background: radial-gradient(circle, #ffe600 0%, #ff8c00 70%, #8b4000 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px #ffb700, inset 0 0 8px rgba(0,0,0,0.4);
      z-index: 3;
    }

    .petal {
      position: absolute;
      width: 45px; height: 75px;
      background: linear-gradient(to top, #ff4081, #ff80ab, #ffffff);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      transform-origin: center bottom;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.4);
    }

    .p1  { transform: translateY(-30px) rotate(0deg); }
    .p2  { transform: translateY(-30px) rotate(45deg); }
    .p3  { transform: translateY(-30px) rotate(90deg); }
    .p4  { transform: translateY(-30px) rotate(135deg); }
    .p5  { transform: translateY(-30px) rotate(180deg); }
    .p6  { transform: translateY(-30px) rotate(225deg); }
    .p7  { transform: translateY(-30px) rotate(270deg); }
    .p8  { transform: translateY(-30px) rotate(315deg); }

    /* Folhas */
    .leaf {
      position: absolute; width: 55px; height: 30px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(140deg, #81c784, #2e7d32);
      box-shadow: inset 2px 2px 5px rgba(255,255,255,.3), 0 0 10px rgba(76, 175, 80, 0.3);
      opacity: 0;
      animation: leafGrow 1s ease-out forwards;
    }
    .leaf.left { left: 18%; bottom: 30%; transform: rotate(-25deg); animation-delay: 1.5s; }
    .leaf.right { right: 18%; bottom: 45%; transform: scaleX(-1) rotate(-25deg); animation-delay: 1.8s; }

    @keyframes leafGrow {
      0% { opacity: 0; transform: scale(0); }
      100% { opacity: 1; }
    }

    /* Mensagem Especial no Rodapé */
    .special-message-container {
      position: absolute;
      bottom: 3.5vh;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      padding: 0 20px;
      pointer-events: none;
    }

    .special-message {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.1rem, 7.5vw, 3.4rem);
      color: #fff3d1;
      text-shadow: 
        0 0 10px rgba(255, 217, 110, 0.8),
        0 0 20px rgba(255, 107, 157, 0.5),
        0 2px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInMsg 2s ease-out 3s forwards;
    }

    @keyframes fadeInMsg {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="scene">
    <!-- Luz de Fundo e Lua -->
    <div class="aurora"></div>
    <div class="moon"></div>

    <!-- Campo de Estrelas -->
    <div class="star-field">
      <div class="star s1"></div>
      <div class="star s2"></div>
      <div class="star s3"></div>
      <div class="star s4"></div>
      <div class="star s5"></div>
      <div class="star s6"></div>
    </div>

    <!-- Vaga-lumes brilhantes -->
    <div class="fireflies">
      <div class="firefly f1"></div>
      <div class="firefly f2"></div>
      <div class="firefly f3"></div>
      <div class="firefly f4"></div>
    </div>

    <!-- Palco Principal (Flor e Grama) -->
    <section class="garden-stage">
      <div class="plant">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <!-- Flor Floral Desenhada -->
        <div class="flower-head">
          <div class="petal p1"></div>
          <div class="petal p2"></div>
          <div class="petal p3"></div>
          <div class="petal p4"></div>
          <div class="petal p5"></div>
          <div class="petal p6"></div>
          <div class="petal p7"></div>
          <div class="petal p8"></div>
          <div class="center-glow"></div>
        </div>
      </div>
      
      <div class="grass"></div>
    </section>

    <!-- Frase Especial Final -->
    <div class="special-message-container">
      <h1 class="special-message">Para uma pessoa especial 🌻</h1>
    </div>
  </main>

</body>
</html>
