<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Um buquê especial para você</title>
<style>
  :root{
    --bg1:#fffaf3;
    --bg2:#fbeef0;
    --bg3:#f1e6f5;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; min-height:100vh; }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 16px;
    background:
      radial-gradient(circle at 50% 30%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    font-family: Georgia, 'Times New Roman', 'Palatino Linotype', serif;
    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .bouquet-svg{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }

  /* ---------- animações ---------- */
  @keyframes growStem{ to{ stroke-dashoffset:0; } }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(0.2); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes bloom{
    0%{ opacity:0; transform:scale(0.15) rotate(-18deg); }
    55%{ opacity:1; transform:scale(1.08) rotate(4deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes wrapPop{
    0%{ opacity:0; transform:scale(0.85) translateY(14px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes ribbonPop{
    0%{ opacity:0; transform:scale(0.5) translateY(10px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.4) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(25deg); }
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-1.1deg); }
    50%{ transform:rotate(1.1deg); }
  }
  @keyframes captionIn{
    0%{ opacity:0; transform:translateY(16px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes glowPulse{
    0%,100%{ text-shadow:0 0 8px rgba(58,123,181,0.25), 0 0 2px rgba(0,0,0,0.05); }
    50%{ text-shadow:0 0 20px rgba(58,123,181,0.45), 0 0 6px rgba(0,0,0,0.05); }
  }

  .stem{
    fill:none;
    stroke:url(#stemGradient);
    stroke-width:7;
    stroke-linecap:round;
    stroke-dasharray:100;
    stroke-dashoffset:100;
    animation-name:growStem;
    animation-duration:1.4s;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  .leaf{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation-name:popIn;
    animation-duration:0.7s;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  .flower{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation-name:bloom;
    animation-duration:1s;
    animation-timing-function:cubic-bezier(.34,1.56,.64,1);
    animation-fill-mode:forwards;
  }
  .wrap-part{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation-name:wrapPop;
    animation-duration:1s;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  .ribbon{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation-name:ribbonPop;
    animation-duration:0.9s;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  .sparkle{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation-name:twinkle;
    animation-duration:2.6s;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  #swayGroup{
    transform-box:fill-box;
    transform-origin:400px 862px;
    animation-name:sway;
    animation-duration:4.5s;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }

  .caption{
    opacity:0;
    margin-top:22px;
    text-align:center;
    padding:0 20px;
    font-style:italic;
    font-weight:700;
    font-size:clamp(1.5rem, 5vw, 2.5rem);
    letter-spacing:0.4px;
    background:linear-gradient(90deg,#3a7bb5,#5b9bd5,#e8590c);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  @media (prefers-reduced-motion: reduce){
    .stem{ stroke-dashoffset:0; animation:none; }
    .leaf,.flower,.wrap-part,.ribbon{ opacity:1; transform:none; animation:none; }
    .sparkle{ display:none; }
    #swayGroup{ animation:none; }
    .caption{ opacity:1; animation:none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <svg class="bouquet-svg" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="stemGradient" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#3f6b34"/>
          <stop offset="100%" stop-color="#79b968"/>
        </linearGradient>
        <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#82c06e"/>
          <stop offset="100%" stop-color="#4c7a3f"/>
        </linearGradient>
        <radialGradient id="sunflowerCenter" cx="35%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#8a5a2e"/>
          <stop offset="100%" stop-color="#4a2c14"/>
        </radialGradient>
        <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a2a3a" flood-opacity="0.18"/>
        </filter>
      </defs>

      <g id="swayGroup">
        <g id="stemsLayer"></g>
        <g id="wrapLayer"></g>
        <g id="ribbonLayer"></g>
        <g id="leavesLayer"></g>
        <g id="flowersLayer"></g>
        <g id="sparkleLayer"></g>
      </g>
    </svg>

    <div class="caption" id="caption">Você é muito especial</div>
  </div>

<script>
(function(){
  const base = { x:400, y:868 };

  // ---------- paleta ----------
  const HYDRANGEA_COLORS = ['#4a90c9', '#5b9bd5', '#3f7fb8'];
  const ROSE_SETS = [
    { outer:'#ffb347', mid:'#ff9d2f', inner:'#ffcc33', center:'#e8590c' },
    { outer:'#ffc55c', mid:'#ffab2e', inner:'#fff3b0', center:'#d9480f' },
    { outer:'#ffa94d', mid:'#ff8f1f', inner:'#ffdb70', center:'#c2410c' }
  ];

  // ---------- dados do buquê (estilo redondo, girassol + rosas laranja + hortênsia azul) ----------
  const mainStems = [
    { end:{x:245,y:300}, type:'hydrangea', scale:1.15 },
    { end:{x:255,y:225}, type:'rose', colors:ROSE_SETS[0], scale:1 },
    { end:{x:285,y:175}, type:'hydrangea', scale:1.15 },
    { end:{x:370,y:150}, type:'sunflower', scale:1.6 },
    { end:{x:330,y:120}, type:'button', scale:0.55 },
    { end:{x:420,y:135}, type:'hydrangea', scale:1.15 },
    { end:{x:460,y:190}, type:'rose', colors:ROSE_SETS[1], scale:1 },
    { end:{x:505,y:155}, type:'hydrangea', scale:1.15 },
    { end:{x:555,y:215}, type:'hydrangea', scale:1.15 },
    { end:{x:520,y:290}, type:'rose', colors:ROSE_SETS[2], scale:1 },
    { end:{x:400,y:310}, type:'hydrangea', scale:1.15 },
    { end:{x:455,y:130}, type:'button', scale:0.55 },
    { end:{x:335,y:255}, type:'hydrangea', scale:1.15 }
  ];
  const fillerStems = [
    { end:{x:210,y:260}, type:'filler', scale:0.9 },
    { end:{x:590,y:260}, type:'filler', scale:0.9 },
    { end:{x:400,y:120}, type:'filler', scale:0.9 },
    { end:{x:305,y:330}, type:'filler', scale:0.9 }
  ];
  const allStems = mainStems.concat(fillerStems);

  // ---------- tempos ----------
  const STEM_STAGGER = 0.08;
  const STEM_DUR = 1.4;
  const stemsFinish = (allStems.length - 1) * STEM_STAGGER + STEM_DUR;

  const WRAP_START = 0.6;
  const RIBBON_START = 1.05;

  const FLOWER_START = stemsFinish + 0.25;
  const FLOWER_STAGGER = 0.22;
  const FLOWER_DUR = 1.0;
  const flowersFinish = FLOWER_START + (mainStems.length - 1) * FLOWER_STAGGER + FLOWER_DUR;

  const SPARKLE_START = flowersFinish + 0.3;
  const CAPTION_DELAY = SPARKLE_START + 0.4;

  // ---------- helpers ----------
  function ctrlFor(end){
    return {
      x: base.x + (end.x - base.x) * 0.6,
      y: base.y - (base.y - end.y) * 0.78
    };
  }
  function bez(p0, p1, p2, t){
    const x = (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x;
    const y = (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y;
    return { x, y };
  }
  function petalRing(count, rx, ry, dist, color, ringRotate){
    ringRotate = ringRotate || 0;
    let s = '<g transform="rotate(' + ringRotate + ')">';
    const step = 360 / count;
    for(let i=0;i<count;i++){
      s += '<ellipse transform="rotate(' + (i*step) + ')" cx="0" cy="-' + dist + '" rx="' + rx + '" ry="' + ry + '" fill="' + color + '"/>';
    }
    s += '</g>';
    return s;
  }

  function roseInner(c){
    return '<g filter="url(#softShadow)">' +
      petalRing(6, 24, 36, 28, c.outer, 0) +
      petalRing(6, 19, 29, 17, c.mid, 30) +
      petalRing(5, 12, 18, 8, c.inner, 15) +
      '<circle cx="0" cy="0" r="6" fill="' + c.center + '"/>' +
      '</g>';
  }
  function sunflowerInner(){
    let s = '<g filter="url(#softShadow)">';
    s += petalRing(16, 6, 34, 30, '#ffcf3d', 0);
    s += petalRing(16, 5, 26, 24, '#ffb200', 11.25);
    s += '<circle cx="0" cy="0" r="22" fill="url(#sunflowerCenter)"/>';
    const dots = [[0,0],[7,4],[-7,4],[7,-4],[-7,-4],[0,9],[0,-9],[12,0],[-12,0],[4,12],[-4,-12]];
    dots.forEach(function(d){
      s += '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="1.6" fill="#2e1c0d" opacity="0.7"/>';
    });
    s += '</g>';
    return s;
  }
  function hydrangeaInner(color){
    const offsets = [[0,0],[16,-9],[-16,-9],[16,9],[-16,9],[0,-19],[0,19],[25,0],[-25,0]];
    const angles = [10,-15,20,-5,25,-20,5,15,-10];
    let s = '<g filter="url(#softShadow)">';
    offsets.forEach(function(o,i){
      s += '<g transform="translate(' + o[0] + ',' + o[1] + ') rotate(' + angles[i] + ')">' +
        petalRing(4, 5, 9, 6, color, 0) +
        '<circle cx="0" cy="0" r="2" fill="#eaf5ff"/>' +
        '</g>';
    });
    s += '</g>';
    return s;
  }
  function buttonInner(){
    let s = '<g filter="url(#softShadow)">';
    s += '<circle cx="0" cy="0" r="9" fill="#ffcb3d"/>';
    const dots = [[3,-3],[-3,-3],[3,3],[-3,3],[0,5],[0,-5],[5,0],[-5,0]];
    dots.forEach(function(d){
      s += '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="1.2" fill="#e8a800"/>';
    });
    s += '</g>';
    return s;
  }
  function fillerInner(){
    const dots = [[0,0],[10,-14],[-9,-12],[4,-26],[-4,-24],[0,-38],[8,-34],[-9,-32]];
    let s = '<g filter="url(#softShadow)">';
    dots.forEach(function(d){
      s += '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="3.6" fill="#fff9f5" opacity="0.92"/>';
    });
    s += '</g>';
    return s;
  }

  let hydrangeaIndex = 0;
  function flowerMarkup(stem, delay){
    let inner = '';
    const scale = stem.scale || 1;
    if(stem.type === 'rose') inner = roseInner(stem.colors);
    else if(stem.type === 'sunflower') inner = sunflowerInner();
    else if(stem.type === 'hydrangea'){
      inner = hydrangeaInner(HYDRANGEA_COLORS[hydrangeaIndex % HYDRANGEA_COLORS.length]);
      hydrangeaIndex++;
    }
    else if(stem.type === 'button') inner = buttonInner();
    else inner = fillerInner();
    return '<g class="flower" style="animation-delay:' + delay + 's" transform="translate(' + stem.end.x + ',' + stem.end.y + ') scale(' + scale + ')">' + inner + '</g>';
  }

  function leafMarkup(x, y, rot, delay){
    return '<g class="leaf" style="animation-delay:' + delay + 's" transform="translate(' + x + ',' + y + ') rotate(' + rot + ')">' +
      '<ellipse cx="0" cy="-14" rx="9" ry="20" fill="url(#leafGradient)"/>' +
      '<path d="M0,-32 L0,4" stroke="#3f6b34" stroke-width="1.1" opacity="0.45"/>' +
      '</g>';
  }
  function sparkleMarkup(x, y, delay, size){
    return '<g class="sparkle" style="animation-delay:' + delay + 's" transform="translate(' + x + ',' + y + ') scale(' + size + ')">' +
      '<path d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z" fill="#fff6d8"/>' +
      '</g>';
  }

  const wrapMarkup =
    '<g class="wrap-part" style="animation-delay:' + WRAP_START + 's">' +
      '<path d="M 400 870 L 210 430 Q 400 380 590 430 L 400 870 Z" fill="#bfe3f5"/>' +
      '<path d="M 400 870 L 260 460 Q 400 420 540 460 L 400 870 Z" fill="#8ecbe8" opacity="0.85"/>' +
      '<path d="M 400 870 L 340 500 L 400 470 L 460 500 Z" fill="#6fb8dd" opacity="0.7"/>' +
    '</g>';

  const ribbonMarkup =
    '<g class="ribbon" style="animation-delay:' + RIBBON_START + 's" transform="translate(400,565)" filter="url(#softShadow)">' +
      '<rect x="-95" y="-16" width="190" height="30" rx="14" fill="#3a7bb5"/>' +
      '<rect x="-95" y="-16" width="190" height="10" rx="5" fill="#5b9bd5" opacity="0.6"/>' +
      '<path d="M0,0 C-40,-24 -56,10 -18,14 C-45,20 -38,44 0,17 Z" fill="#3a7bb5"/>' +
      '<path d="M0,0 C40,-24 56,10 18,14 C45,20 38,44 0,17 Z" fill="#2f5f8a"/>' +
      '<path d="M-5,10 L-26,90 L-11,84 L-4,26 Z" fill="#3a7bb5"/>' +
      '<path d="M5,10 L26,90 L11,84 L4,26 Z" fill="#2f5f8a"/>' +
      '<ellipse cx="0" cy="10" rx="12" ry="9" fill="#274d6e"/>' +
    '</g>';

  // ---------- montagem ----------
  const stemsLayer = document.getElementById('stemsLayer');
  const wrapLayer = document.getElementById('wrapLayer');
  const ribbonLayer = document.getElementById('ribbonLayer');
  const leavesLayer = document.getElementById('leavesLayer');
  const flowersLayer = document.getElementById('flowersLayer');
  const sparkleLayer = document.getElementById('sparkleLayer');
  const swayGroup = document.getElementById('swayGroup');
  const caption = document.getElementById('caption');

  let stemsHTML = '';
  let leavesHTML = '';

  allStems.forEach(function(stem, i){
    const delay = i * STEM_STAGGER;
    const ctrl = ctrlFor(stem.end);
    stemsHTML += '<path class="stem" pathLength="100" d="M ' + base.x + ' ' + base.y +
      ' Q ' + ctrl.x + ' ' + ctrl.y + ' ' + stem.end.x + ' ' + stem.end.y +
      '" style="animation-delay:' + delay + 's"/>';

    if(stem.type !== 'filler'){
      const p1 = bez(base, ctrl, stem.end, 0.5);
      const p2 = bez(base, ctrl, stem.end, 0.72);
      const leanLeft = stem.end.x < 400;
      leavesHTML += leafMarkup(p1.x, p1.y, leanLeft ? -48 : 48, delay + 0.45);
      leavesHTML += leafMarkup(p2.x, p2.y, leanLeft ? -35 : 35, delay + 0.6);
    }
  });

  stemsLayer.innerHTML = stemsHTML;
  leavesLayer.innerHTML = leavesHTML;
  wrapLayer.innerHTML = wrapMarkup;
  ribbonLayer.innerHTML = ribbonMarkup;

  let flowersHTML = '';
  mainStems.forEach(function(stem, i){
    const delay = FLOWER_START + i * FLOWER_STAGGER;
    flowersHTML += flowerMarkup(stem, delay);
  });
  fillerStems.forEach(function(stem, i){
    const delay = FLOWER_START * 0.55 + i * 0.3;
    flowersHTML += flowerMarkup(stem, delay);
  });
  flowersLayer.innerHTML = flowersHTML;

  let sparklesHTML = '';
  const sparkleSpots = [
    [230,240],[300,150],[365,100],[420,90],[490,120],[555,170],[590,240],
    [260,330],[520,330],[400,160],[340,200],[470,200],[350,300]
  ];
  sparkleSpots.forEach(function(pt, i){
    const delay = SPARKLE_START + Math.random() * 1.6 + i * 0.05;
    const size = 0.6 + Math.random() * 0.7;
    sparklesHTML += sparkleMarkup(pt[0], pt[1], delay, size.toFixed(2));
  });
  sparkleLayer.innerHTML = sparklesHTML;

  swayGroup.style.animationDelay = flowersFinish + 's';

  caption.style.animation =
    'captionIn 1s ease-out ' + CAPTION_DELAY + 's forwards, ' +
    'glowPulse 3s ease-in-out ' + (CAPTION_DELAY + 1) + 's infinite';
})();
</script>
</body>
</html>
