  <style>
    :root {
      --ink: #fceeff;

      --violet: #9a4dce;
      --deep: #10051f;

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }

    .garden-shell {
      position: relative;

      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;

    .aurora,

      position: absolute;
      pointer-events: none;
      inset: 0;
    }

    .aurora {
      z-index: -4;
      background:
        radial-gradient(ellipse at 50% 22%, rgba(195, 109, 255, .22) 0%, rgba(96, 39, 156, .08) 28%, transparent 58%),
        radial-gradient(ellipse at 13% 70%, rgba(236, 134, 255, .12) 0%, transparent 35%),
        radial-gradient(ellipse at 88% 74%, rgba(108, 61, 235, .16) 0%, transparent 34%);
      animation: aurora-breathe 8s ease-in-out infinite alternate;
    }

    .moon-halo {
      z-index: -3;

      width: clamp(140px, 20vw, 260px);

      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 244, 255, .18) 0%, rgba(225, 161, 255, .10) 28%, transparent 68%);

    .sky-grain {
      z-index: -2;
      opacity: .23;

      mask-image: linear-gradient(to bottom, black, transparent 78%);

    .stars, .fireflies, .petal-drift {
      position: absolute;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;

    .star {
      position: absolute;
      border-radius: 999px;
      background: #fffaff;

      position: absolute;

      height: 5px;
      border-radius: 999px;
      background: #fff3a6;
      box-shadow: 0 0 8px 3px #ecb3ff, 0 0 22px 5px rgba(190, 82, 255, .55);
      animation: drift-up var(--duration) linear infinite var(--delay);

      position: absolute;
      width: 10px;
      height: 16px;
      border-radius: 80% 20% 80% 20%;
      background: linear-gradient(135deg, #fff2ff, #d975ff 75%);
      box-shadow: 0 0 12px rgba(222, 134, 255, .65);
      opacity: .8;
      animation: petal-fall var(--duration) linear infinite var(--delay);
    }

    .intro {
      position: relative;
      z-index: 5;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      text-align: center;
      animation: rise-in 1.2s cubic-bezier(.22,.8,.25,1) both;

      text-shadow: 0 2px 24px rgba(236, 173, 255, .46);

      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .garden-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;

    .garden-shell.is-paused .stars *,
    .garden-shell.is-paused .fireflies * {
      animation-play-state: paused !important;
    }

    .plant-world {
      position: relative;
      width: min(74vmin, 680px);
      height: min(88vmin, 790px);
      transform-origin: center bottom;

    .ground-glow {

      height: 22%;
      transform: translateX(-50%);

    .ground-line {
      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      background: linear-gradient(90deg, transparent, rgba(239, 180, 255, .75), transparent);
      box-shadow: 0 0 20px rgba(192, 81, 255, .85);

    .stem-system {
      position: absolute;
      bottom: 7%;
      left: 50%;
      width: 76%;
      height: 75%;
      transform: translateX(-50%);
    }

    .stem, .branch {
      position: absolute;

      border-radius: 99px 99px 30px 30px;
      transform-origin: bottom center;

    .stem {
      left: 50%;

      animation: grow-stem 2.3s cubic-bezier(.22,.8,.2,1) forwards;
    }

    .branch {
      width: clamp(7px, 1.45vmin, 14px);
      background: linear-gradient(to top, #4c137d, #d08aff);
      transform: var(--angle) scaleY(0);
      animation: grow-branch 1.7s cubic-bezier(.22,.8,.2,1) forwards var(--start);
    }

    .branch.one { left: 48%; bottom: 26%; height: 30%; --angle: rotate(-39deg); --start: 1.05s; }
    .branch.two { left: 52%; bottom: 30%; height: 34%; --angle: rotate(38deg); --start: 1.18s; }
    .branch.three { left: 49%; bottom: 50%; height: 25%; --angle: rotate(-48deg); --start: 1.45s; }
    .branch.four { left: 51%; bottom: 54%; height: 24%; --angle: rotate(49deg); --start: 1.6s; }

    .leaf {
      position: absolute;
      width: clamp(22px, 5vmin, 52px);
      height: clamp(12px, 2.4vmin, 26px);
      border-radius: 100% 0 100% 0;
      transform: rotate(var(--rotate)) scale(0);

      background: linear-gradient(135deg, #f4d1ff, #b351ef 48%, #4b167b);
      box-shadow: 0 0 14px rgba(221, 135, 255, .58);
      animation: unfurl .9s cubic-bezier(.22,.8,.2,1) forwards var(--start);

    .leaf::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 7%;
      width: 81%;
      height: 1px;
      background: rgba(255,255,255,.6);
      transform: rotate(-18deg);
      transform-origin: left center;
    }

    .leaf.a { left: 22%; bottom: 31%; --rotate: -52deg; --start: 1.65s; }
    .leaf.b { left: 66%; bottom: 37%; --rotate: 25deg; --start: 1.83s; }
    .leaf.c { left: 30%; bottom: 56%; --rotate: -57deg; --start: 2s; }
    .leaf.d { left: 61%; bottom: 59%; --rotate: 24deg; --start: 2.15s; }
    .leaf.e { left: 44%; bottom: 73%; --rotate: -40deg; --start: 2.3s; }

    .flower {
      position: absolute;
      width: clamp(92px, 19vmin, 190px);
      aspect-ratio: 1;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0) rotate(-20deg);
      filter: drop-shadow(0 0 12px #c85dff) drop-shadow(0 0 28px rgba(142, 38, 232, .78));
      animation: bloom 1.35s cubic-bezier(.18,.92,.3,1.3) forwards var(--start);
    }

    .flower-inner {
      width: 100%;
      height: 100%;
      animation: flower-float 4.8s ease-in-out infinite alternate var(--float-delay);
    }

    .flower svg { overflow: visible; }

    .f-top { top: 15%; left: 50%; --start: 2.18s; --float-delay: 0s; }
    .f-left-one { top: 46%; left: 22%; --start: 2.02s; --float-delay: .5s; }
    .f-right-one { top: 40%; left: 78%; --start: 2.12s; --float-delay: 1s; }
    .f-left-two { top: 28%; left: 31%; --start: 2.35s; --float-delay: .3s; }
    .f-right-two { top: 25%; left: 69%; --start: 2.48s; --float-delay: .8s; }

    .grass {
      position: absolute;
      bottom: 6%;
      width: clamp(3px, .7vmin, 7px);
      border-radius: 99px 99px 0 0;
      transform-origin: bottom center;
      background: linear-gradient(to top, #32104e, #c56cff);

    .controls {
      position: absolute;
      z-index: 8;
      bottom: clamp(1rem, 4vw, 2.5rem);
      left: 50%;

      width: max-content;

      animation: rise-in 1.1s .5s cubic-bezier(.22,.8,.25,1) both;
    }

    .control-card {
      display: flex;

    .motion-control {

    @keyframes aurora-breathe { to { transform: scale(1.08); opacity: .85; } }
    @keyframes halo-pulse { 50% { transform: scale(1.12); opacity: .75; } }
    @keyframes twinkle { 0%,100% { opacity: .08; transform: scale(.75); } 50% { opacity: .95; transform: scale(1.35); } }
    @keyframes drift-up { 0% { transform: translate3d(0, 110%, 0) scale(.4); opacity: 0; } 15%,78% { opacity: .9; } 100% { transform: translate3d(var(--drift), -25%, 0) scale(1.15); opacity: 0; } }

  <script>
    const starsContainer = document.getElementById("stars");
    const firefliesContainer = document.getElementById("fireflies");
    const petalsContainer = document.getElementById("petal-drift");
    const plantWorld = document.querySelector(".plant-world");

    for (let i = 0; i < 72; i++) {
      const star = document.createElement("span");
      const size = Math.random() * 2.2 + 0.7;
      star.className = "star";
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 78 + "%";
      star.style.setProperty("--duration", (Math.random() * 3 + 2.2) + "s");
      star.style.setProperty("--delay", (Math.random() * 4) + "s");
      starsContainer.appendChild(star);
    }

    for (let i = 0; i < 24; i++) {
      const firefly = document.createElement("span");
      firefly.className = "firefly";
      firefly.style.left = Math.random() * 100 + "%";
      firefly.style.bottom = (Math.random() * 35 - 15) + "%";
      firefly.style.setProperty("--drift", (Math.random() * 230 - 115) + "px");
      firefly.style.setProperty("--duration", (Math.random() * 7 + 7) + "s");
      firefly.style.setProperty("--delay", (Math.random() * 7) + "s");
      firefliesContainer.appendChild(firefly);
    }

    for (let i = 0; i < 12; i++) {
      const petal = document.createElement("span");
      petal.className = "floating-petal";
      petal.style.left = Math.random() * 100 + "%";
      petal.style.setProperty("--drift", (Math.random() * 240 - 120) + "px");
      petal.style.setProperty("--duration", (Math.random() * 8 + 10) + "s");
      petal.style.setProperty("--delay", (Math.random() * 10) + "s");
      petalsContainer.appendChild(petal);
    }

    for (let i = 0; i < 38; i++) {
      const grass = document.createElement("span");
      grass.className = "grass";
      grass.style.left = (i * 2.7 + Math.random() * 2.3) + "%";
      grass.style.height = (5 + Math.random() * 12) + "vmin";
      grass.style.setProperty("--angle", (Math.random() * 44 - 22) + "deg");
      grass.style.animationDelay = (2.55 + Math.random() * .55) + "s";
      plantWorld.appendChild(grass);
    }

    const toggleButton = document.getElementById("motion-toggle");
    const gardenShell = document.getElementById("garden-shell");
    const gardenStage = document.getElementById("garden-stage");
    const pauseIcon = document.querySelector('[data-template-id="pause-label"]');
    const playIcon = document.querySelector('[data-template-id="play-label"]');

    toggleButton.addEventListener("click", () => {
      const isPaused = gardenShell.classList.toggle("is-paused");
      gardenStage.classList.toggle("is-paused", isPaused);
      toggleButton.setAttribute("aria-pressed", String(isPaused));
      toggleButton.setAttribute("aria-label", isPaused ? "Retomar animação" : "Pausar animação");
      pauseIcon.classList.toggle("hidden", isPaused);
      playIcon.classList.toggle("hidden", !isPaused);
    });

    lucide.createIcons();
  </script>
 </body>
</html>
